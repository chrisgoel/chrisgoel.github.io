<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Eclipse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lancelot&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 300vh; /* Gives room to scroll */
    overflow-x: hidden;
    background: #fff;
    font-family: sans-serif;
}

.scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    perspective: 1500px;
    background-color: #fff;
}

.scene-background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
    user-select: none;
    pointer-events: none;
}

/* Black circle */
/* Spinning vinyl record */
.circle {
    position: absolute;
    width: 400px;
    height: 400px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;

    background:
        /* center spindle hole */
        radial-gradient(circle at center,
            #bdbdbd 0 2px,
            #111 3px 10px,
            #444 11px 11.5px,
            #000 12px 50px,
            transparent 51px),

        /* paper label */
        radial-gradient(circle at center,
            #2b2b2b 0 48px,
            #1b1b1b 49px 62px,
            transparent 63px),

        /* grooves */
        repeating-radial-gradient(circle at center,
            #050505 63px 64px,
            #151515 64px 65px,
            #050505 65px 67px),

        /* vinyl base */
        radial-gradient(circle at 30% 30%,
            #444,
            #111 35%,
            #000 100%);

    box-shadow:
        inset -25px -25px 40px rgba(255,255,255,0.08),
        inset 20px 20px 35px rgba(0,0,0,0.7),
        0 8px 30px rgba(0,0,0,0.2);

    animation: spin 3s linear infinite;
    will-change: transform;

}

.circle.paused {
    animation-play-state: paused;
}

@keyframes spin {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

.label {
    position: absolute;
    width: 120px;
    height: 120px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgb(76 123 156);
    opacity: 80%;
    border: 2px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font: 600 11px sans-serif;
    letter-spacing: 2px;
    text-align: center;
    z-index: 2;
}

.label::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: silver;
}

.music-toggle {
    position: absolute;
    width: 58px;
    height: 58px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(255,255,255,0.42);
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow:
        0 8px 24px rgba(0,0,0,0.32),
        inset 0 1px 0 rgba(255,255,255,0.25);
    cursor: pointer;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    transition: transform 160ms ease, background 160ms ease, opacity 160ms ease;
}

.music-toggle:hover {
    background: rgba(255,255,255,0.22);
    transform: translate(-50%, -50%) scale(1.05);
}

.music-toggle:focus-visible {
    outline: 3px solid rgba(76, 123, 156, 0.9);
    outline-offset: 4px;
}

.music-toggle::before {
    content: "";
    display: block;
    width: 0;
    height: 0;
    margin-left: 4px;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 20px solid currentColor;
}

.music-toggle.playing::before {
    width: 18px;
    height: 24px;
    margin-left: 0;
    border-top: 0;
    border-bottom: 0;
    border-left: 6px solid currentColor;
    border-right: 6px solid currentColor;
}

.music-toggle.dismissed {
    opacity: 0;
    pointer-events: none;
}

.scroll-cue {
    position: absolute;
    left: 50%;
    top: calc(50% + 220px);
    width: 88px;
    height: 88px;
    transform: translate(-50%, 12px);
    border: 0;
    background: transparent;
    color: #000;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    z-index: 3;
    transition: opacity 620ms ease, transform 620ms ease;
}

.scroll-cue.visible {
    opacity: 0.72;
    pointer-events: auto;
    transform: translate(-50%, 0);
    transition-delay: 1s;
}

.scroll-cue svg,
.scroll-cue img {
    display: block;
    width: 100%;
    height: 100%;
}

.scroll-cue img {
    object-fit: contain;
    transform: rotate(90deg);
}

.scroll-cue svg {
    overflow: visible;
}

.scroll-cue path {
    fill: currentColor;
}

/* White rectangle that rises upward */
.rectangle {
    position: absolute;
    width: 400px;
    height: 400px;
    --sleeve-depth: 12px;
    --sleeve-half-depth: calc(var(--sleeve-depth) / 2);

    left: 50%;
    top: 50%;

    transform-style: preserve-3d;
    will-change: transform;
    z-index: 10;
}

/* Front and back covers */

.cover-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow:
        0 0 18px rgba(0,0,0,0.34),
        0 0 42px rgba(0,0,0,0.22),
        0 0 72px rgba(0,0,0,0.12);
}

/* .front {
    background: #d00000;
    transform: translateZ(4px);
} */
.front {
    background-image: url("images/1.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transform: translateZ(var(--sleeve-half-depth));
}

.back {
    background-image: url("images/3.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transform: rotateY(180deg) translateZ(var(--sleeve-half-depth));
}

/* Spine */

.spine {
    position: absolute;

    width: var(--sleeve-depth);
    height: 400px;

    left: calc(var(--sleeve-half-depth) * -1);
    top: 0;

    background: rgb(86, 124, 158);

    transform-origin: center center;
    transform: rotateY(-90deg);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

/* Spine text */

.spine span {
    color: rgb(242, 239, 246);

    font-family: "Lancelot", Georgia, serif;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.18em;
    word-spacing: 0.28em;

    white-space: nowrap;

    transform: rotate(180deg) rotate(90deg);
}
</style>
</head>
<body>

<div class="scene">
    <img class="scene-background" src="images/backgrounds/low-res.png" alt="" width="2380" height="2380">
    <div class="circle">
        <div class="label">
            <div class="title">TWO OF US</div>
        </div>
    </div>
    <button class="music-toggle" type="button" aria-label="Play music" aria-pressed="false"></button>
    <button class="scroll-cue" type="button" aria-label="Scroll down">
        <!-- Option: <img src="images/pointinghand.svg" alt=""> -->
        <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false">
            <path d="M48 82 C42 70 32 58 18 47 C30 52 41 54 48 54 C55 54 66 52 78 47 C64 58 54 70 48 82 Z" />
        </svg>
    </button>
    <div class="rectangle">
        <div class="spine">
            <span>Chris and Kate's Wedding</span>
        </div>

        <div class="cover-face front"></div>
        <div class="cover-face back"></div>
    </div>
</div>

<audio id="music" preload="auto">
    <source src="audio/two-of-us-trimmed.flac" type="audio/flac">
</audio>

<script>
const rectangle = document.querySelector(".rectangle");
const vinyl = document.querySelector(".circle");
const musicButton = document.querySelector(".music-toggle");
const scrollCue = document.querySelector(".scroll-cue");
const music = document.getElementById("music");
let hasStartedMusic = false;

function updateAnimation() {
    const maxScroll = document.body.scrollHeight - window.innerHeight;
    const progress = Math.min(window.scrollY / maxScroll, 1);

    let offset;
    let rotation;

    if (progress < 0.5) {
        const p = progress / 0.5;

        offset = (1 - p) * window.innerHeight;
        rotation = 0;

        vinyl.style.visibility = "visible";
        musicButton.style.visibility = hasStartedMusic ? "hidden" : "visible";
        scrollCue.classList.toggle("visible", hasStartedMusic);
    } else {
        const p = (progress - 0.5) / 0.5;

        offset = 0;
        rotation = p * 180;

        vinyl.style.visibility = "hidden";
        musicButton.style.visibility = "hidden";
        scrollCue.classList.remove("visible");
    }

    rectangle.style.transform = `
        translate(-50%, calc(-50% + ${offset}px))
        rotateY(${rotation}deg)
    `;
}

updateAnimation();
window.addEventListener("scroll", updateAnimation);

function setMusicState(isPlaying) {
    musicButton.classList.toggle("playing", isPlaying);
    musicButton.setAttribute("aria-label", isPlaying ? "Pause music" : "Play music");
    musicButton.setAttribute("aria-pressed", String(isPlaying));
    vinyl.classList.toggle("paused", !isPlaying);

    if (isPlaying) {
        hasStartedMusic = true;
        musicButton.classList.add("dismissed");
        musicButton.style.visibility = "hidden";
        scrollCue.classList.add("visible");
    }
}

setMusicState(false);

musicButton.addEventListener("click", () => {
    if (music.paused) {
        music.play().catch(() => setMusicState(false));
    } else {
        music.pause();
    }
});

scrollCue.addEventListener("click", () => {
    window.scrollTo({
        top: window.innerHeight,
        behavior: "smooth"
    });
});

music.addEventListener("play", () => setMusicState(true));
music.addEventListener("pause", () => setMusicState(false));
music.addEventListener("ended", () => setMusicState(false));
</script>

</body>
</html>
